<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Casa del Nonno</title>

<style>
body{
    margin:0;
    background:#000;
    font-family:Arial,sans-serif;
    color:white;
}

.container{
    max-width:1200px;
    margin:40px auto;
    background:#111;
    border-radius:20px;
    padding:25px;
    box-shadow:0 0 30px orange;
}

h1{
    text-align:center;
    color:orange;
}

.timer{
    float:right;
    background:#222;
    color:orange;
    padding:10px 15px;
    border-radius:10px;
    font-weight:bold;
}

.hidden{
    display:none;
}

input{
    width:100%;
    padding:15px;
    margin:10px 0;
    border:none;
    border-radius:10px;
    box-sizing:border-box;
}

button{
    background:orange;
    border:none;
    border-radius:10px;
    padding:10px 15px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    opacity:0.9;
}

.menu-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
    gap:20px;
}

.category{
    background:#1e1e1e;
    border-radius:15px;
    padding:15px;
}

.category h2{
    color:orange;
}

.item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#2a2a2a;
    padding:10px;
    border-radius:10px;
    margin-bottom:10px;
}

.summary{
    margin-top:30px;
    background:#1c1c1c;
    padding:20px;
    border-radius:15px;
}

.order-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#2a2a2a;
    margin-bottom:8px;
    padding:8px;
    border-radius:8px;
}

.delete-btn{
    background:red;
    color:white;
}

.discount-btn.active{
    border:3px solid white;
}

.login-box{
    max-width:500px;
    margin:80px auto;
}
</style>
</head>
<body>

<div id="loginPage" class="container login-box">

<h1>La Casa del Nonno Login</h1>

<input id="username" placeholder="Benutzername">
<input id="password" type="password" placeholder="Passwort">

<button onclick="login()">Einloggen</button>

</div>

<div id="menuPage" class="container hidden">

<div class="timer" id="timer">01:30:00</div>

<h1>🍝 La Casa del Nonno Menü</h1>

<div class="menu-grid" id="menu"></div>

<div class="summary">

<h2>Bestellung</h2>

<div id="orderList"></div>

<br>

<h2>Rabatt</h2>

<div id="discountButtons"></div>

<br>

<h2 id="total">Gesamt: 0€</h2>

<button onclick="finishOrder()">
Bestellung abschließen
</button>

</div>

</div>

<script>

const USERNAME="Mitarbeiter";
const PASSWORD="LacasadelNonno";

const menu = {

"Bevande":[
["Vino della Casa",350],
["Te Freddo al Limone",195],
["Cola",130],
["Energy Drink",200]
],

"Antipasti":[
["Antipasto Italiano della Casa",110],
["Bruschetta Classica",165]
],

"Pasta":[
["Spaghetti alla Carbonara",300],
["Spaghetti alla Bolognese",300]
],

"Pizza":[
["Margharita",330],
["Salame Piccante",330],
["Tonno e Cipolla",330]
],

"Secondi Piatti":[
["Lasagna Napoletana della Casa",550],
["Grigliata Mista di Pesce",410]
],

"Dessert":[
["Coppa Gelato della Casa",400],
["Tiramisu",275],
["Panna Cotta ai Lamponi Caldi",110]
]

};

let order={};
let discount=0;

function login(){

    const user=document.getElementById("username").value;
    const pass=document.getElementById("password").value;

    if(user===USERNAME && pass===PASSWORD){

        document.getElementById("loginPage")
        .classList.add("hidden");

        document.getElementById("menuPage")
        .classList.remove("hidden");

        renderMenu();
        renderDiscounts();
        startTimer();

    }else{
        alert("Falsche Login Daten");
    }
}

function renderMenu(){

    const container=document.getElementById("menu");

    for(const category in menu){

        const box=document.createElement("div");

        box.className="category";

        let html=`<h2>${category}</h2>`;

        menu[category].forEach(item=>{

            html+=`
            <div class="item">

                <span>
                ${item[0]} - ${item[1]}€
                </span>

                <button onclick="addItem('${item[0]}',${item[1]})">
                Hinzufügen
                </button>

            </div>
            `;
        });

        box.innerHTML=html;

        container.appendChild(box);
    }
}

function addItem(name,price){

    if(!order[name]){

        order[name]={
            quantity:0,
            price:price
        };
    }

    order[name].quantity++;

    updateOrder();
}

function removeItem(name){

    order[name].quantity--;

    if(order[name].quantity<=0){
        delete order[name];
    }

    updateOrder();
}

function updateOrder(){

    const list=document.getElementById("orderList");

    list.innerHTML="";

    let total=0;

    Object.keys(order).forEach(name=>{

        const item=order[name];

        total += item.quantity * item.price;

        list.innerHTML += `
        <div class="order-row">

            <span>
            ${item.quantity}x ${name}
            </span>

            <button
            class="delete-btn"
            onclick="removeItem('${name}')">
            ❌
            </button>

        </div>
        `;
    });

    total = total - (total * discount / 100);

    document.getElementById("total").innerHTML =
    "Gesamt: " + total.toFixed(2) + "€";
}

function renderDiscounts(){

    const box=document.getElementById("discountButtons");

    [5,10,15,20,25,30,35,40,45,50].forEach(value=>{

        box.innerHTML += `
        <button
        class="discount-btn"
        data-discount="${value}"
        onclick="setDiscount(${value})">

        ${value}%

        </button>
        `;
    });
}

function setDiscount(value){

    if(discount===value){
        discount=0;
    }else{
        discount=value;
    }

    document
    .querySelectorAll(".discount-btn")
    .forEach(btn=>{

        btn.classList.remove("active");

        if(Number(btn.dataset.discount)===discount){
            btn.classList.add("active");
        }
    });

    updateOrder();
}

function finishOrder(){

    if(Object.keys(order).length===0){
        alert("Keine Bestellung vorhanden");
        return;
    }

    alert("Bestellung erfolgreich abgeschlossen");

    order={};
    discount=0;

    updateOrder();

    document
    .querySelectorAll(".discount-btn")
    .forEach(btn=>btn.classList.remove("active"));
}

function startTimer(){

    let seconds=5400;

    setInterval(()=>{

        seconds--;

        const h=Math.floor(seconds/3600);
        const m=Math.floor((seconds%3600)/60);
        const s=seconds%60;

        document.getElementById("timer").innerHTML=
        String(h).padStart(2,"0")+":"+
        String(m).padStart(2,"0")+":"+
        String(s).padStart(2,"0");

        if(seconds<=0){

            alert("Automatisch ausgeloggt");

            location.reload();
        }

    },1000);
}

</script>

</body>
</html>
