<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Casa del Nonno</title>

<style>
body{
    margin:0;
    background:#000;
    color:#fff;
    font-family:Arial,sans-serif;
}

.container{
    max-width:1200px;
    margin:40px auto;
    padding:25px;
    background:#111;
    border-radius:20px;
    box-shadow:0 0 25px orange;
}

h1{
    text-align:center;
    color:orange;
}

.timer{
    float:right;
    background:#222;
    color:orange;
    padding:10px 15px;
    border-radius:10px;
    font-weight:bold;
}

.login-box{
    max-width:500px;
    margin:80px auto;
}

input{
    width:100%;
    padding:15px;
    margin:10px 0;
    border:none;
    border-radius:10px;
}

button{
    background:orange;
    color:black;
    border:none;
    padding:12px 20px;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    opacity:0.9;
}

.menu-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:20px;
}

.category{
    background:#1c1c1c;
    padding:15px;
    border-radius:15px;
}

.category h2{
    color:orange;
}

.item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#2a2a2a;
    padding:10px;
    border-radius:10px;
    margin-bottom:10px;
}

.summary{
    margin-top:30px;
    background:#1c1c1c;
    padding:20px;
    border-radius:15px;
}

.discount-buttons button{
    margin:5px;
}

.hidden{
    display:none;
}
</style>
</head>
<body>

<div id="loginPage" class="container login-box">
    <h1>La Casa del Nonno Login</h1>

    <input id="username" placeholder="Benutzername">
    <input id="password" type="password" placeholder="Passwort">

    <button onclick="login()">Einloggen</button>
</div>

<div id="menuPage" class="container hidden">

    <div class="timer" id="timer">01:30:00</div>

    <h1>🍝 La Casa del Nonno Menü</h1>

    <div class="menu-grid" id="menu"></div>

    <div class="summary">

        <h2>Bestellung</h2>

        <div id="orderList"></div>

        <br>

        <h2>Rabatt</h2>

        <div class="discount-buttons" id="discountButtons"></div>

        <h2 id="total">Gesamt: 0€</h2>

        <button onclick="finishOrder()">Bestellung abschließen</button>

    </div>

</div>

<script>

const USERNAME="Mitarbeiter";
const PASSWORD="LacasadelNonno";

const menu = {
"Bevande":[
["Vino della Casa",350],
["Te Freddo al Limone",195],
["Cola",130],
["Energy Drink",200]
],

"Antipasti":[
["Antipasto Italiano della Casa",110],
["Bruschetta Classica",165]
],

"Pasta":[
["Spaghetti alla Carbonara",300],
["Spaghetti alla Bolognese",300]
],

"Pizza":[
["Margharita",330],
["Salame Piccante",330],
["Tonno e Cipolla",330]
],

"Secondi Piatti":[
["Lasagna Napoletana della Casa",550],
["Grigliata Mista di Pesce",410]
],

"Dessert":[
["Coppa Gelato della Casa",400],
["Tiramisu",275],
["Panna Cotta ai Lamponi Caldi",110]
]
};

let order=[];
let discount=0;
let timerInterval;

function login(){

    if(
        document.getElementById("username").value===USERNAME &&
        document.getElementById("password").value===PASSWORD
    ){

        document.getElementById("loginPage").classList.add("hidden");
        document.getElementById("menuPage").classList.remove("hidden");

        renderMenu();
        renderDiscounts();
        startTimer();

    }else{
        alert("Falsche Login-Daten");
    }
}

function renderMenu(){

    const container=document.getElementById("menu");

    for(const category in menu){

        const div=document.createElement("div");
        div.className="category";

        div.innerHTML=`<h2>${category}</h2>`;

        menu[category].forEach(item=>{

            div.innerHTML += `
            <div class="item">
                <span>${item[0]} - ${item[1]}€</span>
                <button onclick="addItem('${item[0]}',${item[1]})">
                    Hinzufügen
                </button>
            </div>`;
        });

        container.appendChild(div);
    }
}

function addItem(name,price){

    order.push({name,price});

    updateOrder();
}

function updateOrder(){

    const list=document.getElementById("orderList");

    list.innerHTML="";

    let total=0;

    order.forEach(item=>{

        total+=item.price;

        list.innerHTML += `
        <div>${item.name} - ${item.price}€</div>`;
    });

    total = total - (total*discount/100);

    document.getElementById("total").innerHTML=
    `Gesamt: ${total.toFixed(2)}€`;
}

function renderDiscounts(){

    const box=document.getElementById("discountButtons");

    [5,10,15,20,25,30,35,40,45,50].forEach(p=>{

        box.innerHTML += `
        <button onclick="setDiscount(${p})">
            ${p}%
        </button>`;
    });
}

function setDiscount(p){

    discount=p;
    updateOrder();
}

function finishOrder(){

    if(order.length===0){
        alert("Keine Produkte ausgewählt");
        return;
    }

    alert("Bestellung erfolgreich abgeschlossen!");

    order=[];
    discount=0;

    document.getElementById("orderList").innerHTML="";
    document.getElementById("total").innerHTML="Gesamt: 0€";
}

function startTimer(){

    let seconds=5400;

    timerInterval=setInterval(()=>{

        seconds--;

        const h=Math.floor(seconds/3600);
        const m=Math.floor((seconds%3600)/60);
        const s=seconds%60;

        document.getElementById("timer").innerHTML=
            String(h).padStart(2,"0")+":"+
            String(m).padStart(2,"0")+":"+
            String(s).padStart(2,"0");

        if(seconds<=0){

            clearInterval(timerInterval);

            alert("Sitzung abgelaufen");

            location.reload();
        }

    },1000);
}

</script>

</body>
</html>
